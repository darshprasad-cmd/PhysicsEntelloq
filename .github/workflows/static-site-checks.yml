name: Static site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate published artifact
        shell: bash
        run: |
          test -s index.html
          if grep -q 'gsk_' index.html; then
            echo '::error::Groq credential marker found in published artifact'
            exit 1
          fi
          grep -q '<title>Physics Entelloq' index.html
          grep -q 'function viewHome' index.html
          grep -q 'function viewProgress' index.html
          grep -q 'var Tutor=' index.html
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            learning-tools-source/learning/package-lock.json
            qa/package-lock.json
            visualization-source/package-lock.json
      - name: Parse inline scripts
        run: node .github/validate-inline-scripts.js
      - name: Check shared physics visualization mathematics and asset parity
        run: |
          npm ci --prefix visualization-source --no-audit --no-fund
          npm test --prefix visualization-source
          node visualization-source/build.mjs --check
          node --test .github/test-cbse-preservation.js
      - name: Verify generated experience is current
        run: node .github/build-experience.js --check
      - name: Verify scientific module sources and published assets
        run: |
          node .github/build-scientific-lab-assets.mjs --check
          node --test .github/test-scientific-labs.js
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check robot geometry and local companion boundaries
        run: |
          python -m unittest discover -s scientific-labs/robotics/tests -p 'test_*.py'
          python -m unittest discover -s scientific-labs/tests -p 'test_*.py'
      - name: Check shared AI requests, streaming and structured responses
        run: node --test .github/test-ai.js .github/test-answer-format.js
      - name: Check cradle physics against analytical results
        run: node --test .github/test-cradle.js
      - name: Check camera physics evidence and scientific model boundaries
        run: node --test .github/test-camera-physics.js .github/test-camera-lifecycle.js
      - name: Check application design contracts
        run: node --test .github/test-app-design.js .github/test-hand-builder.js
      - name: Check restored visual-first Learn experience
        run: node --test .github/test-visual-learn.js
      - name: Check founder restoration and first-account tutorial
        run: node --test .github/test-welcome.js
      - name: Check search, graph parsing and simulation cleanup regressions
        run: node --test .github/test-quality.js
      - name: Check voluntary Advanced Studio entry and treatment contracts
        run: node --test .github/test-advanced.js
      - name: Check observatory orbit and accessible launch contracts
        run: node --test .github/test-observatory.js
      - name: Check observatory palette continuity and text contrast
        run: node --test .github/test-observatory-theme.js
      - name: Check light-mode learning surfaces and instrument contrast
        run: node --test .github/test-light-mode.js
      - name: Verify new learning assets and review/notebook models
        run: |
          python scripts/sync-learning-tools.py --check
          node --test learning-tools-source/physics/tests/core.test.mjs
          npm ci --prefix learning-tools-source/learning --no-audit --no-fund
          npm test --prefix learning-tools-source/learning
          node --test learning-tools-source/sketches/tests/core.test.mjs
      - name: Install locked browser test dependencies
        run: |
          npm ci --prefix qa --no-audit --no-fund
          ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check integrated learning workspaces in Chromium
        env:
          CODEX_NODE_MODULES: ${{ github.workspace }}/qa/node_modules
        run: |
          node scripts/check-learning-tools-browser.cjs
          node scripts/check-visual-tools-browser.cjs
          node qa/learning-host-quality.cjs
          node qa/physics-visualization.cjs
